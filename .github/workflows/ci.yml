name: Cloud-Shield CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-shield-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:

    name: Backend Tests and Frontend Build

    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7.0

        ports:
          - 27017:27017

        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test

      MONGODB_URI: mongodb://127.0.0.1:27017/cloud_shield_test

      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/cloud_shield_test

    steps:

      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Step 3: Install backend dependencies
      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      # Step 4: Create isolated test database collection
      - name: Initialize MongoDB test collection
        run: |
          mongosh "$MONGODB_URI" --quiet --eval 'db.createCollection("securityevents")'

      # Step 5: Create and verify security indexes
      - name: Initialize security event indexes
        working-directory: server
        run: node scripts/migrate-security-event-indexes.js

      # Step 6: Run backend tests
      - name: Run backend tests
        working-directory: server
        run: npm test

      # Step 7: Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      # Step 8: Run ESLint
      - name: Run frontend lint
        working-directory: client
        run: npm run lint

      # Step 9: Build frontend
      - name: Build frontend
        working-directory: client
        run: npm run build